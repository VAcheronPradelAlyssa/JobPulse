<div class="job-list-container">
  <h2>Job Applications</h2>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading">
    Loading job applications...
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <!-- Jobs Table -->
  <div *ngIf="!isLoading && jobs.length > 0" class="jobs-table">
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Position</th>
          <th>Status</th>
          <th>Applied Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let job of jobs">
          <td>{{ job.company }}</td>
          <td>{{ job.position }}</td>
          <td>
            <select [(ngModel)]="job.status" (change)="updateStatus(job, job.status)" class="status-select">
              <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
            </select>
          </td>
          <td>{{ job.appliedDate }}</td>
          <td class="actions">
            <button class="delete-btn" (click)="deleteJob(job.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && jobs.length === 0" class="empty-state">
    <p>No job applications found</p>
  </div>
</div>
